name: habit_tracker
description: "An open-source habit building & quitting tracker. No paywall, ever."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local database
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1

  # Navigation
  go_router: ^14.2.0

  # Notifications / reminders
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Home screen widgets
  home_widget: ^0.6.0

  # Charts (Insights tab)
  fl_chart: ^0.68.0

  # Import / export
  file_picker: ^8.0.6
  share_plus: ^12.0.0

  # Utils
  uuid: ^4.4.2
  intl: ^0.19.0
  collection: ^1.18.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.7.0
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/icons/